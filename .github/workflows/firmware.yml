name: Corne firmware
on:
  pull_request:
  push:
    branches: [main, 'feat/layer-lighting-updates']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  command-mode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Registry, exact presets, boot interruption and QMK behavior
        run: |
          python3 tools/apply_command_mode_patches.py
          python3 tools/command_mode_assets.py check
          python3 tests/command_mode_assets.py
          python3 tests/storage_bootstrap.py
          python3 tests/command_mode_test.py
          python3 tests/keypeek_packet.py
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -DCOMMAND_MODE_ENABLE tests/layer_lighting.c -o /tmp/command-lighting
          /tmp/command-lighting
  mac-helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test native helper
        run: |
          swift test --package-path tools/CommandModeHelper
          swift build -c release --package-path tools/CommandModeHelper
          tools/CommandModeHelper/.build/release/command-mode-helper dry-run --seconds 2
          python3 tools/CommandModeHelper/verify_cli.py
          mkdir -p helper-artifacts
          cp tools/CommandModeHelper/.build/release/command-mode-helper helper-artifacts/
          cp tools/CommandModeHelper/README.md helper-artifacts/
          swift --version > helper-artifacts/compiler.txt
          uname -m > helper-artifacts/architecture.txt
          (cd helper-artifacts && shasum -a 256 command-mode-helper > SHA256SUMS)
          tar -czf command-mode-helper-macos.tar.gz -C helper-artifacts .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-mode-helper-macos
          path: command-mode-helper-macos.tar.gz
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {route: vial, revision: rev4_0/standard, name: vial-rev4_0-standard}
          - {route: vial, revision: rev4_1/standard, name: vial-rev4_1-standard}
          - {route: via, revision: rev4_0/standard, name: via-rev4_0-standard}
          - {route: via, revision: rev4_1/standard, name: via-rev4_1-standard}
          - {route: via, revision: rev4_0/mini, name: via-rev4_0-mini}
          - {route: via, revision: rev4_1/mini, name: via-rev4_1-mini}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libusb-1.0-0-dev libhidapi-hidraw0 libhidapi-libusb0
          python -m pip install -r requirements-qmk.txt
          python -m pip check
      - name: Check layer output adapter
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined tests/layer_lighting.c -o /tmp/layer-lighting
          /tmp/layer-lighting
      - name: Build firmware
        env:
          ROUTE: ${{ matrix.route }}
          REVISION: ${{ matrix.revision }}
        run: |
          export QMK_USERSPACE="$PWD"
          if [ "$ROUTE" = vial ]; then
            export QMK_HOME="$PWD/src/vial-kb/vial-qmk"
            make kb=crkbd vial-qmk-init
            make kb=crkbd kr="$REVISION" km=vial vial-qmk-compile
          else
            export QMK_HOME="$PWD/src/qmk/qmk_firmware"
            make kb=crkbd qmk-init
            make kb=crkbd kr="$REVISION" km=via qmk-compile
          fi
          mkdir -p firmware-artifacts
          cp "$QMK_HOME"/.build/*.uf2 firmware-artifacts/
          if [ "$ROUTE" = vial ] && [ "$REVISION" = rev4_1/standard ]; then
            python3 tools/verify_command_mode_build.py --elf "$QMK_HOME/.build/tmp_crkbd_rev4_1_standard_vial.elf" --uf2 "$QMK_HOME/.build/tmp_crkbd_rev4_1_standard_vial.uf2" > firmware-artifacts/command-mode.json
          fi
          (cd firmware-artifacts && sha256sum *.uf2 > SHA256SUMS)
          git submodule status --recursive > firmware-artifacts/submodules.txt
          arm-none-eabi-gcc --version > firmware-artifacts/compiler.txt
          python -m pip freeze > firmware-artifacts/python.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: firmware-artifacts/
          if-no-files-found: error
